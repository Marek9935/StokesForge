# Repository CI: Rust core and embedded Python integration.
# This root file is the only one GitLab reads.
#
# WARNING — what `fmt`, `clippy` and `test` do NOT prove:
#
# These three jobs never enable the Cargo feature `python`. Everything that
# touches PyO3 (crates `stokesforge-python`, `stokesforge-script`, and the
# integration in `stokesforge-app`) is therefore compiled **empty** here: the
# Python bridge — the riskiest part of the whole architecture — is neither
# compiled, nor checked by clippy, nor tested by these three jobs. A green
# pipeline on these three jobs only says that the pure Rust core compiles and
# passes its tests; it says nothing about the Python bridge.
#
# The interpreter is not versioned; `test-python` vendors it, generates
# PYO3_CONFIG_FILE and tests this path automatically. Its failure blocks the
# pipeline; no system Python is required.

stages:
  - check

# Runners: only personal runners are used (shared ones are disabled in GitLab).
# The Linux **and Windows** jobs run on GitHub (`.github/workflows/ci.yml`,
# hosted runners), which sends back their external statuses; the GitLab release
# is also created there (`publier` job, #333). Set STOKESFORGE_CI_LINUX=gitlab
# to enable the Linux jobs here again with a Linux runner. No GitLab Windows
# runner is needed any more.

variables:
  STOKESFORGE_CI_LINUX: "github"
  CARGO_HOME: "${CI_PROJECT_DIR}/.cargo"
  # #88: the shared runner filled its disk (`No space left on device`)
  # on the jobs that compile Typst and egui. No incremental compilation
  # (useless in CI) and no debug info: the `test` profile inherits from
  # `main`. A CI-only setting: `Cargo.toml` stays untouched, and so does local
  # debugging.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

.linux-job:
  tags: [linux]
  rules:
    - if: '$STOKESFORGE_CI_LINUX == "gitlab"'

# One key per job: they used to share one key per branch and overwrote each
# other's large `target/` (#88).
.rust-cache: &rust-cache
  cache:
    key: cargo-${CI_JOB_NAME}-${CI_COMMIT_REF_SLUG}
    paths:
      - .cargo/
      - target/

# `fmt` compiles nothing: only the Cargo registry is worth keeping.
fmt:
  stage: check
  extends: .linux-job
  image: rust:1
  cache:
    key: cargo-${CI_JOB_NAME}-${CI_COMMIT_REF_SLUG}
    paths:
      - .cargo/
  script:
    - rustup component add rustfmt
    - cargo fmt --all -- --check
    # python3 ships with rust:1 (Debian buildpack-deps); install it if an image lacks it.
    - command -v python3 >/dev/null || (apt-get update -qq && apt-get install -y -qq python3)
    # Hits: translate to English or mark deliberate French (docs/tests.md, "French guard").
    - python3 scripts/french-guard-test.py
    - python3 scripts/french-guard.py
    - scripts/release-notes-test.sh
    - scripts/versions-aligned.sh
    - scripts/release-tag-test.sh

# #362: the user manual (manual/) must build. mdBook is the prebuilt binary of
# the version pinned in scripts/manual-tools.env.
manual:
  stage: check
  extends: .linux-job
  image: rust:1
  script:
    - source scripts/manual-tools.env
    - curl -fsSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C /usr/local/bin
    - scripts/manual-build.sh

# #362: live manual on GitLab Pages. Not a Linux-runner job: it runs on the
# GitLab.com instance runners (no `tags`), only on a pipeline started by
# `scripts/release-publish.sh` (variable STOKESFORGE_PUBLISH_MANUAL) on a FINAL
# tag, never on the pipeline GitLab starts at push time: the site goes live
# once the release and its packages exist. An -rcN never replaces the live
# manual. It does not rebuild: it unpacks the archive of the release from the
# package registry, so the site is byte-identical to the downloadable manual.
pages:
  stage: check
  image: alpine:3.20
  rules:
    - if: '$STOKESFORGE_PUBLISH_MANUAL == "1" && $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  script:
    - apk add --no-cache curl tar
    - VERSION="${CI_COMMIT_TAG#v}"
    - NOM="StokesForge-${VERSION}-manual"
    - curl --fail --silent --show-error --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --output "${NOM}.tar.gz" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/stokesforge/${VERSION}/${NOM}.tar.gz"
    - tar -xzf "${NOM}.tar.gz"
    - mv "${NOM}" public
  artifacts:
    paths:
      - public

# #129: policy and notices, all platforms and the python feature included,
# without compiling the workspace. Versions shared with the distribution.
licenses:
  stage: check
  extends: .linux-job
  image: rust:1
  cache:
    key: cargo-${CI_JOB_NAME}-${CI_COMMIT_REF_SLUG}
    paths:
      - .cargo/
  script:
    - source scripts/licenses-tools.env
    - cargo install cargo-deny --locked --version "$CARGO_DENY_VERSION"
    # The cargo-about binary needs the `cli` feature, off by default:
    # without it, `cargo install` succeeds and installs nothing (#332).
    - cargo install cargo-about --locked --features cli --version "$CARGO_ABOUT_VERSION"
    - export PATH="${CARGO_HOME}/bin:${PATH}"
    - cargo deny --locked check licenses
    - scripts/licenses-test.sh
    - scripts/licenses-rust.sh target/licenses/THIRD-PARTY-LICENSES.txt
  artifacts:
    paths:
      - target/licenses/THIRD-PARTY-LICENSES.txt

clippy:
  stage: check
  extends: .linux-job
  image: rust:1
  <<: *rust-cache
  script:
    - rustup component add clippy
    - cargo clippy --workspace --all-targets -- -D warnings

# `cargo test --workspace` now also covers `stokesforge-robustness` (robustness
# bench, added on 2026-09-11). Mind what this covers: this crate holds TWO
# kinds of test, and this job runs only one of them.
#
#   - the GUARDS pass and must keep passing — they run here, like any test
#     of the repository;
#   - the REPRODUCTIONS of anomalies fail on purpose. They are `#[ignore]`,
#     so they are NOT run here: the `robustness` job below handles them.
test:
  stage: check
  extends: .linux-job
  image: rust:1
  <<: *rust-cache
  script:
    - cargo test --workspace

# Reproductions of anomalies of the robustness bench: the `#[ignore]` tests of
# `stokesforge-robustness`, one per anomaly, under the identifier their
# attribute carries. None is left today (V1, #333: "zero red" criterion); the
# job runs `--ignored` so that a reproduction added in the future is seen in
# every pipeline.
#
# `allow_failure: true`: a reproduction fails until its anomaly is fixed;
# making it blocking would keep the pipeline red all the time. The batteries
# without `#[ignore]` run in `test` and `test-python`, which are blocking.
#
# **When a reproduction turns green**, remove its `#[ignore]` so that the
# guard takes over in the `test` job. Original anomalies and fixing order:
# `docs/archive/rustrewrite/` (robustness reports,
# `guide-de-correction-robustesse.md`).
robustness:
  stage: check
  extends: .linux-job
  image: rust:1
  <<: *rust-cache
  allow_failure: true
  script:
    - cargo test -p stokesforge-robustness -- --ignored

# Python #70: automatic and blocking, runtime and compilations cached.
# scripts/python-test.sh covers bridge, scripts, robustness, application and CLI.
# The ignored reproductions and the Matplotlib spike stay explicit trials.
test-python:
  stage: check
  extends: .linux-job
  image: rust:1
  # Two separate caches (`.rust-cache` cannot be reused as is here: its anchor
  # already carries the `cache` key, and merging it into a list item would
  # nest `cache` under `cache`). The first has the same shape as `.rust-cache`
  # (Cargo dependencies and artifacts, keys per branch); the second belongs to
  # this job — see its comment.
  cache:
    - key: cargo-python-${CI_COMMIT_REF_SLUG}
      paths:
        - .cargo/
        - target/
    # Separate cache, keyed on the version lock: the archive and the extracted
    # prefix change only if vendor/python/lock.env changes, so they stay
    # cached from one run to the next without downloading again.
    - key:
        files:
          - vendor/python/lock.env
      paths:
        - vendor/python/*.tar.gz
        - vendor/python/extracted/
  before_script:
    # Minimum required by scripts/python-vendor.sh, checked in the script
    # itself: `curl` (downloads the python-build-standalone archive),
    # `tar` (extraction), `ca-certificates` (TLS validation by curl of the
    # GitHub certificate). Nothing more: no compiler and no system Python
    # are needed, the vendored interpreter bootstraps its own pip with
    # `ensurepip` if needed.
    - apt-get update && apt-get install -y --no-install-recommends ca-certificates curl tar
  script:
    - scripts/python-vendor.sh
    - scripts/python-test.sh
