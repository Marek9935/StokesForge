# CI de la branche rewriterust — cœur Rust uniquement. Le CI Python
# (legacy-python/.gitlab-ci.yml) est gardé pour référence mais n'est plus
# exécuté : ce fichier racine est le seul lu par GitLab.

stages:
  - check

variables:
  CARGO_HOME: "${CI_PROJECT_DIR}/.cargo"

.rust-cache: &rust-cache
  cache:
    key: cargo-${CI_COMMIT_REF_SLUG}
    paths:
      - .cargo/
      - target/

fmt:
  stage: check
  image: rust:1
  <<: *rust-cache
  script:
    - rustup component add rustfmt
    - cargo fmt --all -- --check

clippy:
  stage: check
  image: rust:1
  <<: *rust-cache
  script:
    - rustup component add clippy
    - cargo clippy --workspace --all-targets -- -D warnings

test:
  stage: check
  image: rust:1
  <<: *rust-cache
  script:
    - cargo test --workspace
