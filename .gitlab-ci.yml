# CI du dépôt : cœur Rust et intégration Python embarquée.
# Ce fichier racine est le seul lu par GitLab.
#
# ATTENTION — ce que `fmt`, `clippy` et `test` ne prouvent PAS :
#
# Ces trois travaux n'activent jamais la feature Cargo `python`. Tout ce qui
# touche à PyO3 (crates `stokesforge-python`, `stokesforge-script`, et l'intégration
# côté `stokesforge-app`) est donc compilé **vide** ici : le pont Python — la
# partie la plus risquée de toute l'architecture — n'est ni compilé, ni
# vérifié par clippy, ni testé par ces trois travaux. Un pipeline vert sur ces
# trois travaux dit seulement que le cœur Rust pur compile et passe ses
# tests ; il ne dit rien du pont Python.
#
# L'interpréteur n'est pas versionné ; `test-python` le vendorise, génère
# PYO3_CONFIG_FILE et teste ce chemin automatiquement. Son échec bloque le
# pipeline ; aucun Python système n'est requis.

stages:
  - check

# Runners : seuls les runners perso servent (partagés désactivés dans GitLab).
# Les travaux Linux **et Windows** s'exécutent sur GitHub (`.github/workflows/ci.yml`,
# runners hébergés), qui retourne leurs statuts externes ; la release GitLab y
# est aussi créée (travail `publier`, #333). Poser STOKESFORGE_CI_LINUX=gitlab
# pour réactiver les travaux Linux ici avec un runner Linux. Plus aucun runner
# Windows GitLab n'est nécessaire.

variables:
  STOKESFORGE_CI_LINUX: "github"
  CARGO_HOME: "${CI_PROJECT_DIR}/.cargo"
  # #88 : le runner partagé saturait son disque (`No space left on device`)
  # sur les travaux qui compilent Typst et egui. Pas de compilation
  # incrémentale (inutile en CI) et pas d'informations de débogage : le profil
  # `test` hérite de `main`. Réglage propre à la CI, `Cargo.toml` reste intact
  # et le débogage local aussi.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

.linux-job:
  tags: [linux]
  rules:
    - if: '$STOKESFORGE_CI_LINUX == "gitlab"'

# Une clé par travail : ils ne partageaient qu'une clé par branche et se
# réécrivaient mutuellement un `target/` volumineux (#88).
.rust-cache: &rust-cache
  cache:
    key: cargo-${CI_JOB_NAME}-${CI_COMMIT_REF_SLUG}
    paths:
      - .cargo/
      - target/

# `fmt` ne compile rien : seul le registre Cargo vaut d'être gardé.
fmt:
  stage: check
  extends: .linux-job
  image: rust:1
  cache:
    key: cargo-${CI_JOB_NAME}-${CI_COMMIT_REF_SLUG}
    paths:
      - .cargo/
  script:
    - rustup component add rustfmt
    - cargo fmt --all -- --check
    - scripts/release-notes-test.sh
    - scripts/versions-alignees.sh
    - scripts/release-tag-test.sh

# #129 : politique et notices, toutes plateformes et feature python comprise,
# sans compilation du workspace. Versions partagées avec la distribution.
licenses:
  stage: check
  extends: .linux-job
  image: rust:1
  cache:
    key: cargo-${CI_JOB_NAME}-${CI_COMMIT_REF_SLUG}
    paths:
      - .cargo/
  script:
    - source scripts/licenses-tools.env
    - cargo install cargo-deny --locked --version "$CARGO_DENY_VERSION"
    # Le binaire de cargo-about exige la feature `cli`, absente par défaut :
    # sans elle, `cargo install` réussit sans rien installer (#332).
    - cargo install cargo-about --locked --features cli --version "$CARGO_ABOUT_VERSION"
    - export PATH="${CARGO_HOME}/bin:${PATH}"
    - cargo deny --locked check licenses
    - scripts/licenses-test.sh
    - scripts/licenses-rust.sh target/licenses/THIRD-PARTY-LICENSES.txt
  artifacts:
    paths:
      - target/licenses/THIRD-PARTY-LICENSES.txt

clippy:
  stage: check
  extends: .linux-job
  image: rust:1
  <<: *rust-cache
  script:
    - rustup component add clippy
    - cargo clippy --workspace --all-targets -- -D warnings

# `cargo test --workspace` couvre désormais aussi `stokesforge-robustesse` (banc de
# robustesse, ajouté le 2026-09-11). Attention à ce que cela recouvre : ce
# crate porte DEUX natures de test, et celle-ci n'en lance qu'une.
#
#   - les GARDE-FOUS passent et doivent continuer à passer — ils sont lancés
#     ici, comme n'importe quel test du dépôt ;
#   - les REPRODUCTIONS d'anomalies échouent délibérément. Elles sont
#     `#[ignore]`, donc PAS lancées ici : c'est le travail `robustesse`
#     ci-dessous qui s'en charge.
test:
  stage: check
  extends: .linux-job
  image: rust:1
  <<: *rust-cache
  script:
    - cargo test --workspace

# Reproductions d'anomalies du banc de robustesse : les `#[ignore]` de
# `stokesforge-robustesse`, une par anomalie, sous l'identifiant que porte leur
# attribut. Il n'en reste aucune aujourd'hui (V1, #333 : critère « zéro
# rouge ») ; le travail lance `--ignored` pour qu'une reproduction remise à
# l'avenir soit vue à chaque pipeline.
#
# `allow_failure: true` : une reproduction échoue tant que son anomalie n'est
# pas corrigée ; la rendre bloquante mettrait le pipeline au rouge en
# permanence. Les batteries sans `#[ignore]` tournent, elles, dans `test` et
# `test-python`, bloquants.
#
# **Quand une reproduction passe au vert**, retirer son `#[ignore]` pour que le
# garde-fou prenne le relais dans le travail `test`. Anomalies d'origine et
# ordre de correction : `docs/archive/rustrewrite/` (rapports de robustesse,
# `guide-de-correction-robustesse.md`).
robustesse:
  stage: check
  extends: .linux-job
  image: rust:1
  <<: *rust-cache
  allow_failure: true
  script:
    - cargo test -p stokesforge-robustesse -- --ignored

# Python #70 : automatique et bloquant, runtime et compilations en cache.
# scripts/python-test.sh couvre pont, scripts, robustesse, application et CLI.
# Les reproductions ignorées et le spike Matplotlib restent des essais explicites.
test-python:
  stage: check
  extends: .linux-job
  image: rust:1
  # Deux caches distincts (`.rust-cache` n'est pas réutilisable tel quel ici :
  # son ancre porte déjà la clé `cache`, la fusionner dans un élément de liste
  # imbriquerait `cache` sous `cache`). Le premier reprend la même forme que
  # `.rust-cache` (dépendances et artefacts Cargo, clés par branche) ; le
  # second est propre à ce travail — voir son commentaire.
  cache:
    - key: cargo-python-${CI_COMMIT_REF_SLUG}
      paths:
        - .cargo/
        - target/
    # Cache séparé, clé sur le verrou de versions : l'archive et le préfixe
    # extrait ne changent que si vendor/python/lock.env change, donc restent
    # en cache d'une exécution à l'autre sans retéléchargement.
    - key:
        files:
          - vendor/python/lock.env
      paths:
        - vendor/python/*.tar.gz
        - vendor/python/extracted/
  before_script:
    # Minimum requis par scripts/python-vendor.sh, vérifié dans le script
    # lui-même : `curl` (téléchargement de l'archive python-build-standalone),
    # `tar` (extraction), `ca-certificates` (validation TLS par curl du
    # certificat de GitHub). Rien de plus : aucun compilateur ni Python
    # système n'est nécessaire, l'interpréteur vendorisé amorce lui-même son
    # pip par `ensurepip` si besoin.
    - apt-get update && apt-get install -y --no-install-recommends ca-certificates curl tar
  script:
    - scripts/python-vendor.sh
    - scripts/python-test.sh
