# CI GitLab — tout le CI/CD reste sur GitLab (décision 2026-09-04).
#
# Le tier gratuit GitLab.com ne fournit de runners partagés que pour
# Linux, et avec un quota mensuel de minutes de calcul limité. Deux
# conséquences assumées :
#
# 1. Les jobs légers (lint, tests, couverture) tournent à chaque push :
#    c'est ce qui protège les phases 1 à 11.
# 2. Le build AppImage est LOURD (Briefcase télécharge beaucoup, ~544 Mo
#    en sortie). Il ne tourne donc PAS à chaque commit : `when: manual`
#    sur la branche par défaut, automatique uniquement sur les tags de
#    release. C'est le poste de consommation à surveiller
#    (Settings → Usage Quotas).
#
# Le programme « GitLab for Open Source » (quota étendu) exigerait une
# licence approuvée OSI, incompatible avec la licence propriétaire
# actuelle — porte fermée tant que ce choix tient.
#
# Windows et macOS n'ont pas de runner partagé ici. Les jobs ci-dessous
# sont déclarés mais inertes tant qu'aucun runner auto-hébergé n'est
# branché (`tags:`). Le build Windows sera automatisé via une VM Windows
# auto-hébergée au moment de la phase 12 — une machine Windows propre
# est de toute façon nécessaire pour tester l'installeur (point de
# vigilance #3, docs/architecture.md). Jusque-là, la validation du
# packaging Windows est manuelle et non continue : coût assumé.
# macOS reste hors périmètre de release (ROADMAP.md, « Politique macOS »).

stages:
  - lint
  - test
  - package

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  QT_QPA_PLATFORM: "offscreen"

.linux_python_base:
  image: python:3.12-bookworm
  cache:
    key: "pip-$CI_COMMIT_REF_SLUG"
    paths:
      - .cache/pip
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends
      libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0
      libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1
      libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0
      libdbus-1-3 libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6
      xvfb
    - python -m venv .venv
    - source .venv/bin/activate
    - pip install -e ".[dev]"

lint:ruff:
  extends: .linux_python_base
  stage: lint
  script:
    - source .venv/bin/activate
    - ruff check .

test:linux:
  extends: .linux_python_base
  stage: test
  script:
    - source .venv/bin/activate
    # offscreen d'abord (rapide, pas de serveur X requis) ; xvfb-run en
    # filet de sécurité si un test venait à exiger un vrai display.
    # La couverture est mesurée sur les couches testées : plotyx.core
    # (noyau métier, phase 1), plotyx.commands (bus d'undo, phase 2),
    # plotyx.ui (`QAbstractTableModel`/`QAbstractItemModel` sur
    # `Worksheet`/`Project`, dialogues, fenêtre principale, wizard d'import,
    # fenêtre de graphe et panneau de propriétés — testés avec `pytest-qt`
    # en headless), plotyx.io (parseurs, registre — sans Qt, testable seul)
    # et, depuis la phase 6, plotyx.plot : la couche `PlotSpec` neutre,
    # sans Qt ni moteur de rendu, dont PyQtGraph et (phase 10) Matplotlib
    # sont deux renderers. La roadmap vise 85 % sur core/commands/io/plot
    # et >75 % sur l'UI ; le seuil global ci-dessous est le garde-fou
    # automatique, tenu par la moyenne pondérée. `-m "not corpus"` exclut
    # le test qui parcourt le corpus réel de la thèse : il n'existe que sur
    # la machine de dev (données non
    # publiées, jamais committées — voir tests/test_io_corpus.py) et se
    # saute proprement en local ; l'exclure ici évite un skip silencieux
    # à chaque run CI plutôt qu'un vrai contrôle.
    - >
      QT_QPA_PLATFORM=offscreen xvfb-run -a pytest -v -m "not corpus" --junitxml=report.xml
      --cov=plotyx.core --cov=plotyx.commands --cov=plotyx.plot --cov=plotyx.ui --cov=plotyx.io
      --cov-report=term --cov-report=xml --cov-fail-under=85
  coverage: '/^TOTAL\s+\d+\s+\d+\s+(\d+%)$/'
  artifacts:
    when: always
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 1 week

package:linux:appimage:
  extends: .linux_python_base
  stage: package
  needs: ["lint:ruff", "test:linux"]
  script:
    - source .venv/bin/activate
    - pip install briefcase
    - briefcase create linux appimage --no-docker
    - briefcase build linux appimage --no-docker
    - briefcase package linux appimage --no-docker --adhoc-sign
  artifacts:
    paths:
      - dist/*.AppImage
    expire_in: 30 days
  rules:
    # Automatique sur tag de release uniquement : c'est là qu'un
    # artefact est réellement attendu.
    - if: '$CI_COMMIT_TAG'
    # Sur la branche par défaut, déclenchement manuel — préserve le
    # quota de minutes, l'AppImage n'a pas à être reconstruit à chaque
    # commit. `allow_failure: true` pour qu'un job manuel non lancé ne
    # marque pas le pipeline en attente.
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true

# --- Windows : inerte tant qu'aucun runner auto-hébergé n'est branché ---

package:windows:msi:
  stage: package
  tags:
    - windows # VM auto-hébergée requise (prévue phase 12), absente du tier gratuit
  when: manual
  allow_failure: true
  script:
    - python -m venv .venv
    - .venv\Scripts\activate
    - pip install -e ".[dev]"
    - pip install briefcase
    - briefcase create windows app
    - briefcase build windows app
    - briefcase package windows app
  artifacts:
    paths:
      - dist/*.msi
    expire_in: 30 days

# --- macOS : filet de sécurité non bloquant (Politique macOS, ROADMAP.md) ---

package:macos:
  stage: package
  tags:
    - macos # runner auto-hébergé requis, absent du tier gratuit — hors périmètre
  when: manual
  allow_failure: true
  script:
    - python3 -m venv .venv
    - source .venv/bin/activate
    - pip install -e ".[dev]"
    - pip install briefcase
    - briefcase create macOS app
    - briefcase build macOS app
    # Pas de `briefcase package` : pas de notarisation en phase 0,
    # artefact non publié (voir Politique macOS, ROADMAP.md).
