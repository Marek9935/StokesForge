# Report independent of CI: it also runs after a failure or a cancellation.
name: GitLab results

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  contents: read

# Serialize the reports of one commit, without canceling one mid-publication.
concurrency:
  group: gitlab-status-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  report:
    if: >-
      github.repository == 'Marek9935/StokesForge' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # workflow_run must never run the code of a pull request with the secret.
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Check the reporter
        run: python3 scripts/gitlab-status-test.py
      - name: Publish the results to GitLab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLAB_STATUS_TOKEN: ${{ secrets.GITLAB_STATUS_TOKEN }}
        run: python3 scripts/gitlab-status.py
