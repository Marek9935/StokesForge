# CI Linux sur GitHub Actions (miroir du dépôt GitLab).
#
# Reprend les travaux `tags: [linux]` de `.gitlab-ci.yml`, désactivés par défaut
# côté GitLab faute de runner Linux. Le fichier GitLab fait foi : toute
# modification de ses commandes se répercute ici. Les travaux Windows
# (`dist-windows`, `test-python-windows`) restent sur le runner GitLab.
#
# Comme côté GitLab, `fmt`, `clippy` et `test` n'activent jamais la feature
# `python` : seul `test-python` exerce le pont PyO3.

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# Un push plus récent annule la série en cours sur la même référence.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Mêmes réglages que GitLab (#88) : pas d'incrémental, pas d'infos de débogage.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/gitlab-status-test.py
      - run: rustup component add rustfmt
      - run: cargo fmt --all -- --check

  # #129 : politique et notices, sans compilation du workspace.
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Outils de licences
        run: |
          source scripts/licenses-tools.env
          cargo install cargo-deny --locked --version "$CARGO_DENY_VERSION"
          cargo install cargo-about --locked --features cli --version "$CARGO_ABOUT_VERSION"
      - run: cargo deny --locked check licenses
      - run: scripts/licenses-test.sh
      - run: scripts/licenses-rust.sh target/licenses/THIRD-PARTY-LICENSES.txt
      - uses: actions/upload-artifact@v4
        with:
          name: third-party-licenses
          path: target/licenses/THIRD-PARTY-LICENSES.txt

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: rustup component add clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # Inclut les garde-fous de `stokesforge-robustesse` ; les `#[ignore]`
  # (reproductions d'anomalies) sont dans le travail `robustesse`.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # Les captures (egui_kittest + wgpu) exigent un adaptateur Vulkan : le
      # runner n'a pas de GPU, lavapipe (Mesa) fournit un rendu logiciel.
      - name: Pilote Vulkan logiciel
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1
      - run: cargo test --workspace

  # Reproductions d'anomalies : échouent par construction tant que l'anomalie
  # n'est pas corrigée, donc non bloquant (`allow_failure` côté GitLab).
  robustesse:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # En cas d'échec, les premières erreurs et la fin du journal sont posées en
      # annotation (lisible sans connexion, y compris par l'API), car ce travail
      # est non bloquant et son journal n'est pas remonté dans GitLab.
      - run: |
          set +e
          cargo test -p stokesforge-robustesse -- --ignored > robustesse.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "::error title=robustesse::$( (grep -m6 -E '^error|panicked|FAILED' robustesse.log; echo ...; tail -n 12 robustesse.log) | tr '\n' '|' | cut -c1-1500)"
          fi
          exit "$code"

  # Pont Python : bloquant. L'interpréteur est vendorisé par le script,
  # aucun Python système n'est requis (curl, tar et ca-certificates suffisent).
  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: |
            vendor/python/*.tar.gz
            vendor/python/extracted/
          key: python-${{ hashFiles('vendor/python/lock.env') }}
      # Les captures (egui_kittest + wgpu) exigent un adaptateur Vulkan : le
      # runner n'a pas de GPU, lavapipe (Mesa) fournit un rendu logiciel.
      - name: Pilote Vulkan logiciel
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1
      # Le build de `wayland-sys` (feature python) s'édite avec pkg-config.
      - name: Fichiers de développement Wayland
        run: sudo apt-get install -y --no-install-recommends libwayland-dev
      - run: scripts/python-vendor.sh
      - run: scripts/python-test.sh

  # #333 : publication Linux. Sur un tag vX.Y.Z seulement, une fois les
  # contrôles bloquants verts : vérifie le tag (versions des crates, section de
  # CHANGELOG.md), assemble et éprouve la distribution, téléverse l'archive dans
  # le registre de paquets de GitLab. Aucune release GitHub : GitHub n'est qu'un
  # miroir de GitLab, où `publier` (.gitlab-ci.yml) lie l'archive à la release,
  # avec l'installeur Windows de `dist-windows`.
  release-linux:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [fmt, licenses, clippy, test, test-python]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Tag et notes
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" > /dev/null
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: |
            vendor/python/*.tar.gz
            vendor/python/extracted/
          key: python-${{ hashFiles('vendor/python/lock.env') }}
      - name: Outils de licences
        run: |
          source scripts/licenses-tools.env
          cargo install cargo-deny --locked --version "$CARGO_DENY_VERSION"
          cargo install cargo-about --locked --features cli --version "$CARGO_ABOUT_VERSION"
      # La distribution ouvre la fenêtre : écran virtuel et rendu logiciel.
      - name: Dépendances d'exécution
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1 libwayland-dev xvfb
      - run: scripts/python-vendor.sh
      - run: xvfb-run -a scripts/app-dist.sh
      - run: scripts/release-linux.sh "$GITHUB_REF_NAME"
      - name: Archive dans GitLab
        env:
          GITLAB_RELEASE_TOKEN: ${{ secrets.GITLAB_RELEASE_TOKEN }}
        run: scripts/release-linux-televerser.sh "$GITHUB_REF_NAME"
