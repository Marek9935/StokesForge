# CI on GitHub Actions (mirror of the GitLab repository), Linux and Windows.
#
# Repeats the `tags: [linux]` jobs of `.gitlab-ci.yml`, disabled by default on
# the GitLab side for lack of a Linux runner. The GitLab file is the reference:
# any change to its commands is repeated here. The Windows jobs
# (`dist-windows`, `test-python-windows`) and the release jobs (`release-linux`,
# `release-manual`, `publier`) live only here, on hosted runners (#333):
# GitLab runs only the `pages` job, started by `publier` (#362).
#
# As on the GitLab side, `fmt`, `clippy` and `test` never enable the `python`
# feature: only `test-python` exercises the PyO3 bridge.

name: CI

on:
  push:
    # Linux on all these branches; Windows only outside `feature/**` (see the
    # `if` of `test-python-windows` and `dist-windows`).
    branches: [main, 'feature/**', 'v[0-9]*', 'release/**']
    tags: ['v*']
  pull_request:

# A newer push cancels the running series on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Same settings as GitLab (#88): no incremental build, no debug info.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      # Full history and tags: versions-aligned.sh compares the pyst API
      # snapshots with those of the released tags (#356).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/gitlab-status-test.py
      - run: python3 scripts/french-guard-test.py
      # Hits: translate to English or mark deliberate French (docs/tests.md, "French guard").
      - run: python3 scripts/french-guard.py
      - run: scripts/release-notes-test.sh
      - run: scripts/install-linux-test.sh
      - run: scripts/glibc-floor-test.sh
      - run: scripts/linux-packages-test.sh
      - run: scripts/versions-aligned.sh
      - run: scripts/release-tag-test.sh
      - run: rustup component add rustfmt
      - run: cargo fmt --all -- --check

  # #390: the RPM and DEB packages. nfpm (pinned, checksum verified) packs a fake
  # distribution; rpm and dpkg-deb then read the packages back. The real packages
  # are built and installed in containers at the tag (`release-linux`,
  # `test-linux-packages`).
  linux-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/nfpm-install.sh
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm
      - run: scripts/linux-packages-test.sh --nfpm

  # #362: the user manual (manual/) must build. mdBook is the prebuilt binary
  # of the version pinned in scripts/manual-tools.env (no `cargo install`).
  manual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: mdBook
        run: |
          source scripts/manual-tools.env
          curl -fsSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: scripts/manual-build.sh

  # #129: policy and notices, without compiling the workspace.
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: License tools
        run: |
          source scripts/licenses-tools.env
          cargo install cargo-deny --locked --version "$CARGO_DENY_VERSION"
          cargo install cargo-about --locked --features cli --version "$CARGO_ABOUT_VERSION"
      - run: cargo deny --locked check licenses
      - run: scripts/licenses-test.sh
      - run: scripts/licenses-rust.sh target/licenses/THIRD-PARTY-LICENSES.txt
      - uses: actions/upload-artifact@v4
        with:
          name: third-party-licenses
          path: target/licenses/THIRD-PARTY-LICENSES.txt

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: rustup component add clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # Includes the guards of `stokesforge-robustness`; the `#[ignore]` tests
  # (reproductions of anomalies) are in the `robustness` job.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # The captures (egui_kittest + wgpu) need a Vulkan adapter: the runner
      # has no GPU, lavapipe (Mesa) provides software rendering.
      - name: Software Vulkan driver
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1
      - run: cargo test --workspace

  # Reproductions of anomalies (`#[ignore]` in robustness; none today): they
  # fail until the anomaly is fixed, so the job is non-blocking
  # (`allow_failure` on the GitLab side).
  robustness:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # `-p stokesforge-robustness` alone pulls in `wayland-sys`, which links
      # with pkg-config: without this package the job failed at compilation,
      # without ever running a test (observed on 2026-10-26).
      - name: Wayland development files
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwayland-dev
      # On failure, the first errors and the end of the log are put in an
      # annotation (readable without signing in, including through the API),
      # because this job is non-blocking and its log is not sent back to GitLab.
      - run: |
          set +e
          cargo test -p stokesforge-robustness -- --ignored > robustness.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "::error title=robustness::$( (grep -m6 -E '^error|panicked|FAILED' robustness.log; echo ...; tail -n 12 robustness.log) | tr '\n' '|' | cut -c1-1500)"
          fi
          exit "$code"

  # Python bridge: blocking. The script vendors the interpreter, so no system
  # Python is required (curl, tar and ca-certificates are enough).
  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: |
            vendor/python/*.tar.gz
            vendor/python/extracted/
          key: python-${{ hashFiles('vendor/python/lock.env') }}
      # The captures (egui_kittest + wgpu) need a Vulkan adapter: the runner
      # has no GPU, lavapipe (Mesa) provides software rendering.
      - name: Software Vulkan driver
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1
      # The build of `wayland-sys` (python feature) links with pkg-config.
      - name: Wayland development files
        run: sudo apt-get install -y --no-install-recommends libwayland-dev
      - run: scripts/python-vendor.sh
      - run: scripts/python-test.sh

  # #333: Linux release. On a tag vX.Y.Z or vX.Y.Z-rcN (the -rcN tests the
  # build and the upload, without a release), once the blocking checks are
  # green: checks the tag (crate versions, CHANGELOG.md section), builds and
  # tests the distribution, uploads the archive to the GitLab package registry.
  # No GitHub release: GitHub is only a mirror of GitLab, where the `publier`
  # job below creates the release and links the archive and the Windows
  # installer of `dist-windows` to it.
  release-linux:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [fmt, licenses, clippy, test, test-python]
    # #389: the archive needs a glibc at least as recent as the machine that
    # builds it, so this job (and only this one) builds on the floor machine,
    # Ubuntu 22.04 = glibc 2.35 (scripts/glibc-floor.env). The day GitHub
    # retires this runner, change the runner and the floor together.
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The tagged commit is on main or on a release branch
        run: scripts/release-tag-on-main.sh "$GITHUB_REF_NAME" "$GITHUB_SHA"
      - name: The tag is above the existing tags
        run: scripts/release-tag-increasing.sh "$GITHUB_REF_NAME"
      - name: Tag and notes
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" > /dev/null
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: |
            vendor/python/*.tar.gz
            vendor/python/extracted/
          key: python-${{ hashFiles('vendor/python/lock.env') }}
      - name: License tools
        run: |
          source scripts/licenses-tools.env
          cargo install cargo-deny --locked --version "$CARGO_DENY_VERSION"
          cargo install cargo-about --locked --features cli --version "$CARGO_ABOUT_VERSION"
      # The distribution opens the window: virtual screen and software rendering.
      - name: Runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1 libwayland-dev libxkbcommon-x11-0 xvfb desktop-file-utils
      - run: scripts/python-vendor.sh
      # On failure, the first errors and the end of the log are put in an
      # annotation (readable through the API without signing in).
      - run: |
          set +e
          xvfb-run -a scripts/app-dist.sh > dist.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "::error title=app-dist::$( (grep -m6 -E 'ERROR|^error|panicked|FAILED' dist.log; echo ...; tail -n 14 dist.log) | tr '\n' '|' | cut -c1-1500)"
          fi
          exit "$code"
      # #389: no file of the archive may need a glibc above the floor.
      - run: scripts/glibc-floor.sh dist/stokesforge-app
      - run: scripts/release-linux.sh "${GITHUB_REF_NAME}"
      # #390: RPM and DEB from the same assembled folder (install.sh left out).
      - run: scripts/nfpm-install.sh
      - run: scripts/release-linux-packages.sh "${GITHUB_REF_NAME}"
      # #387: the installer of the real archive, per user then with sudo.
      - name: Installer of the archive
        run: |
          set -euo pipefail
          archive="$(ls "$PWD"/dist/StokesForge-*-linux-x86_64.tar.gz)"
          scripts/install-linux-test.sh --archive "$archive"
          work="$(mktemp -d)"
          tar -xzf "$archive" -C "$work"
          cd "$work"/StokesForge-*/
          sudo ./install.sh --system
          test -x /usr/local/bin/stokesforge
          /usr/local/bin/stokesforge --version
          test -f /usr/local/share/applications/stokesforge.desktop
          desktop-file-validate /usr/local/share/applications/stokesforge.desktop
          sudo ./install.sh --system --uninstall
          test ! -e /usr/local/bin/stokesforge
          test ! -e /opt/stokesforge/current
          test ! -e /usr/local/share/mime/packages/stokesforge.xml
      - name: Archive to GitLab
        env:
          GITLAB_RELEASE_TOKEN: ${{ secrets.GITLAB_RELEASE_TOKEN }}
        run: scripts/release-upload.sh linux "$GITHUB_REF_NAME"
      # The packages are tested in containers (`test-linux-packages`) and only
      # then uploaded (`upload-linux-packages`).
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/StokesForge-*-linux-x86_64.rpm
            dist/StokesForge-*-linux-x86_64.deb
            dist/StokesForge-*-linux-x86_64.tar.gz
          retention-days: 14
          if-no-files-found: error

  # #390: the real packages on the distributions they are for: install with the
  # package dependencies only, version, menu entry, .stf type, window under a
  # virtual screen, removal, clash with install.sh --system, rpmlint / lintian
  # (scripts/linux-packages-install-test.sh). Fedora is pinned to a release.
  test-linux-packages:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release-linux]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: fedora:42
            format: rpm
          - image: debian:12
            format: deb
          - image: ubuntu:22.04
            format: deb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: dist
      - name: Install and remove in ${{ matrix.image }}
        run: |
          set -euo pipefail
          package="$(ls "$PWD"/dist/StokesForge-*-linux-x86_64.${{ matrix.format }})"
          archive="$(ls "$PWD"/dist/StokesForge-*-linux-x86_64.tar.gz)"
          docker run --rm -v "$PWD/scripts:/scripts:ro" -v "$PWD/dist:/dist:ro" ${{ matrix.image }} \
            /scripts/linux-packages-install-test.sh "/dist/$(basename "$package")" "/dist/$(basename "$archive")"

  # #390: upload of the packages to the GitLab registry, after their tests and
  # only when the publication switch of scripts/linux-packages.env is 1. The
  # job always runs on a tag and the gating is on the steps: a job skipped by
  # its own `if` would make `publier` (which needs it) skip too.
  upload-linux-packages:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test-linux-packages]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Publication switch
        id: switch
        run: |
          source scripts/linux-packages.env
          echo "publish=${PUBLISH_LINUX_PACKAGES}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        if: steps.switch.outputs.publish == '1'
        with:
          name: linux-packages
          path: dist
      - name: Packages to GitLab
        if: steps.switch.outputs.publish == '1'
        env:
          GITLAB_RELEASE_TOKEN: ${{ secrets.GITLAB_RELEASE_TOKEN }}
        run: |
          scripts/release-upload.sh rpm "$GITHUB_REF_NAME"
          scripts/release-upload.sh deb "$GITHUB_REF_NAME"

  # #362: manual of the tag. Same tag guards as `release-linux`; builds the
  # manual with the version in its title and uploads its archive to the GitLab
  # package registry, where `publier` links it to the release.
  release-manual:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [fmt, manual]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The tagged commit is on main or on a release branch
        run: scripts/release-tag-on-main.sh "$GITHUB_REF_NAME" "$GITHUB_SHA"
      - name: The tag is above the existing tags
        run: scripts/release-tag-increasing.sh "$GITHUB_REF_NAME"
      - name: mdBook
        run: |
          source scripts/manual-tools.env
          curl -fsSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: scripts/manual-build.sh "$GITHUB_REF_NAME"
      - name: Manual to GitLab
        env:
          GITLAB_RELEASE_TOKEN: ${{ secrets.GITLAB_RELEASE_TOKEN }}
        run: scripts/release-upload.sh manual "$GITHUB_REF_NAME"

  # #333: Windows on a hosted runner (clean machine, parallel to Linux).
  # Blocking: `publier` waits for them. On failure, the first errors and the
  # end of the log are put in an annotation (readable through the API without
  # signing in). Git Bash (`shell: bash`): the scripts are the same as on Linux.
  test-python-windows:
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/feature/')
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      # Long paths: `.cargo/registry` exceeds MAX_PATH (see .windows-job).
      - run: git config --system core.longpaths true
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: |
            vendor/python/*.tar.gz
            vendor/python/extracted/
          key: python-windows-${{ hashFiles('vendor/python/lock.env') }}
      - run: |
          set +e
          { bash scripts/python-vendor.sh && bash scripts/python-test.sh; } > windows-test.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "::error title=test-python-windows::$( (grep -m6 -E '^error|panicked|FAILED' windows-test.log; echo ...; tail -n 12 windows-test.log) | tr '\n' '|' | cut -c1-1500)"
          fi
          exit "$code"

  dist-windows:
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/feature/')
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --system core.longpaths true
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: |
            vendor/python/*.tar.gz
            vendor/python/extracted/
          key: python-windows-${{ hashFiles('vendor/python/lock.env') }}
      # License tools at the versions of scripts/licenses-tools.env, kept in
      # cache: compiling them from scratch is slow.
      - uses: actions/cache@v4
        id: outils
        with:
          path: |
            ~/.cargo/bin/cargo-deny.exe
            ~/.cargo/bin/cargo-about.exe
          key: outils-licences-windows-${{ hashFiles('scripts/licenses-tools.env') }}
      - name: License tools
        if: steps.outils.outputs.cache-hit != 'true'
        run: |
          source scripts/licenses-tools.env
          cargo install cargo-deny --locked --version "$CARGO_DENY_VERSION"
          cargo install cargo-about --locked --features cli --version "$CARGO_ABOUT_VERSION"
      # Inno Setup 6: already on the image, otherwise installed by Chocolatey.
      - name: Inno Setup
        run: |
          if [ ! -e "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ] && [ ! -e "/c/Program Files/Inno Setup 6/ISCC.exe" ]; then
            choco install innosetup -y --no-progress
          fi
      - run: |
          set +e
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export STOKESFORGE_VERSION="${GITHUB_REF_NAME#v}"; fi
          { bash scripts/python-vendor.sh && bash scripts/app-dist-windows.sh; } > windows-dist.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "::error title=dist-windows::$( (grep -m6 -E '^error|ERROR|panicked|FAILED' windows-dist.log; echo ...; tail -n 12 windows-dist.log) | tr '\n' '|' | cut -c1-1500)"
          fi
          exit "$code"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installeur
          path: dist/StokesForge-*-windows-setup.exe
      - name: Installer to GitLab
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITLAB_RELEASE_TOKEN: ${{ secrets.GITLAB_RELEASE_TOKEN }}
        run: scripts/release-upload.sh windows "$GITHUB_REF_NAME"

  # #333: GitLab release. On a tag vX.Y.Z or vX.Y.Z-rcN, when the blocking
  # checks (Linux and Windows) and the package uploads are done (the RPM and DEB
  # ones only when the switch of scripts/linux-packages.env is 1, #390). A -rcN is
  # a trial: the release is created then deleted (see
  # scripts/release-publish.sh), the tag stays. Does not depend on any GitLab
  # runner.
  publier:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [fmt, licenses, clippy, test, test-python, robustness, test-python-windows, manual, linux-packages, release-linux, upload-linux-packages, release-manual, dist-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The tagged commit is on main or on a release branch
        run: scripts/release-tag-on-main.sh "$GITHUB_REF_NAME" "$GITHUB_SHA"
      - name: The tag is above the existing tags
        run: scripts/release-tag-increasing.sh "$GITHUB_REF_NAME"
      - name: Release GitLab
        env:
          GITLAB_RELEASE_TOKEN: ${{ secrets.GITLAB_RELEASE_TOKEN }}
        run: scripts/release-publish.sh "$GITHUB_REF_NAME"
