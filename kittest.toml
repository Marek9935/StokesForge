# Screenshot tolerance (`egui_kittest`, `harness.snapshot`).
# The reference images come from Linux; another graphics driver rasterizes
# fine text differently down to the pixel. Linux keeps the default strictness
# (threshold 0.6, no pixel over the threshold); elsewhere, a few isolated
# pixels are tolerated. A real regression touches hundreds.
# See docs/tests.md, "Screenshots".

[windows]
max_failed_pixels = 10

[mac]
max_failed_pixels = 10
