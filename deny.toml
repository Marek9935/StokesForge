# Checks the whole workspace, all platforms and the python feature included.
# The distribution texts are produced with about.toml; keep the two policies
# in agreement when Cargo.lock changes.
[graph]
all-features = true

[licenses]
include-dev = true
confidence-threshold = 0.93
allow = [
    "GPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "0BSD",
    "OFL-1.1",
]

# Permissions limited to the components actually reviewed, not to any future
# dependency. The fonts stay under their original licenses.
[[licenses.exceptions]]
crate = "epaint_default_fonts@0.36.2"
allow = ["Ubuntu-font-1.0"]

[[licenses.exceptions]]
crate = "option-ext@0.2.0"
allow = ["MPL-2.0"]

# Test-only dependency (egui_kittest → dify), never shipped: no notice to
# provide. MPL-2.0 is GPL-compatible and applies only to the crate's own
# files, which we do not modify.
[[licenses.exceptions]]
crate = "colored@2.2.0"
allow = ["MPL-2.0"]

# The 5.0.3 manifest announces MIT but its LICENSE file is BSD-3-Clause.
# Keep Dropbox's text; the hash ties the clarification to that file.
[[licenses.clarify]]
crate = "brotli-decompressor@5.0.3"
expression = "BSD-3-Clause"
license-files = [{ path = "LICENSE", hash = 0x1a60a92d }]
