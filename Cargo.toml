[workspace]
resolver = "2"
exclude = ["vendor/winit", "vendor/smithay-clipboard"]
members = [
    "crates/stokesforge-id",
    "crates/stokesforge-core",
    "crates/stokesforge-commands",
    "crates/stokesforge-session",
    "crates/stokesforge-plot",
    "crates/stokesforge-render",
    "crates/stokesforge-render-egui",
    "crates/stokesforge-render-svg",
    "crates/stokesforge-persistence",
    "crates/stokesforge-import",
    "crates/stokesforge-analysis",
    "crates/stokesforge-clipboard",
    "crates/stokesforge-importer",
    "crates/stokesforge-python",
    "crates/stokesforge-script",
    "crates/stokesforge-cli",
    "crates/stokesforge-app-state",
    "crates/stokesforge-app",
    "crates/stokesforge-robustness",
    "crates/stokesforge-arch-guard",
    "crates/stokesforge-logo-gen",
]

[workspace.package]
edition = "2021"
license = "GPL-3.0-or-later"

# #452: line tables only (panics and backtraces keep file:line; no variable
# debug info, so builds and target/ are smaller). The test profile inherits dev.
# To inspect variables in a debugger: CARGO_PROFILE_DEV_DEBUG=true cargo build.
[profile.dev]
debug = "line-tables-only"

[workspace.lints.clippy]
all = "warn"

# Transition #72: Wayland repository without a beta migration of the whole egui stack.
# Diff and removal: vendor/winit/STOKESFORGE.md.
[patch.crates-io]
winit = { path = "vendor/winit" }
smithay-clipboard = { path = "vendor/smithay-clipboard" }
