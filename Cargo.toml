[workspace]
resolver = "2"
members = [
    "crates/plotyx-core",
    "crates/plotyx-commands",
    "crates/plotyx-session",
    "crates/plotyx-persistence",
    "crates/plotyx-python",
    "crates/plotyx-script",
    "crates/plotyx-cli",
    "crates/plotyx-app",
]

[workspace.package]
edition = "2021"

[workspace.lints.clippy]
all = "warn"
