[workspace]
resolver = "2"
members = [
    "crates/plotyx-id",
    "crates/plotyx-core",
    "crates/plotyx-commands",
    "crates/plotyx-session",
    "crates/plotyx-plot",
    "crates/plotyx-render",
    "crates/plotyx-render-egui",
    "crates/plotyx-render-svg",
    "crates/plotyx-persistence",
    "crates/plotyx-import",
    "crates/plotyx-importer",
    "crates/plotyx-python",
    "crates/plotyx-script",
    "crates/plotyx-cli",
    "crates/plotyx-app",
    "crates/plotyx-robustesse",
    "crates/plotyx-arch-guard",
]

[workspace.package]
edition = "2021"

[workspace.lints.clippy]
all = "warn"
