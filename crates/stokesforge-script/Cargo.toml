[package]
name = "stokesforge-script"
version = "1.0.0"
edition.workspace = true
license.workspace = true
description = "Python script thread: interpreter lifecycle, interruption, and the `pyst` witness surface exposed to scripts. Everything sits behind the `python` feature."

[lints]
workspace = true

[features]
default = []
# Everything that touches Python sits behind this feature: without it, the
# crate compiles empty, pulls in no PyO3 dependency, and CI stays green on a
# machine with no vendored interpreter.
python = [
    "dep:stokesforge-analysis",
    "dep:stokesforge-core",
    "dep:stokesforge-commands",
    "dep:stokesforge-plot",
    "dep:stokesforge-session",
    "dep:stokesforge-python",
    "dep:stokesforge-import",
    "dep:stokesforge-importer",
    "dep:stokesforge-render-svg",
    "dep:pyo3",
    "dep:numpy",
    "dep:thiserror",
]

[dependencies]
stokesforge-analysis = { version = "1.0.0", path = "../stokesforge-analysis", optional = true }
stokesforge-core = { version = "1.0.0", path = "../stokesforge-core", optional = true }
stokesforge-commands = { version = "1.0.0", path = "../stokesforge-commands", optional = true }
stokesforge-plot = { version = "1.0.0", path = "../stokesforge-plot", optional = true }
stokesforge-session = { version = "1.0.0", path = "../stokesforge-session", optional = true }
stokesforge-python = { version = "1.0.0", path = "../stokesforge-python", optional = true, features = ["python"] }
stokesforge-import = { path = "../stokesforge-import", optional = true }
stokesforge-importer = { path = "../stokesforge-importer", optional = true }
# Figure export (`pyst.export_graph`, #331): the same rendering as the application.
# No interface dependency comes in (render-svg pulls in neither egui nor winit).
stokesforge-render-svg = { path = "../stokesforge-render-svg", optional = true }
# Versions EXACTLY those of stokesforge-python: the numpy ABI is tied to the
# CPython ABI and rust-numpy to a precise PyO3 version (see vendor/python/lock.env).
pyo3 = { version = "0.29.2", optional = true, default-features = false, features = ["macros"] }
numpy = { version = "0.29.0", optional = true }
thiserror = { version = "2.0", optional = true }

[dev-dependencies]
stokesforge-render = { path = "../stokesforge-render" }
stokesforge-arch-guard = { path = "../stokesforge-arch-guard" }
toml = "0.8"
tempfile = "3"

[[bin]]
name = "stokesforge-selftest"
path = "src/bin/stokesforge-selftest.rs"
required-features = ["python"]

[[example]]
name = "matplotlib-spike"
path = "examples/matplotlib-spike.rs"
required-features = ["python"]
