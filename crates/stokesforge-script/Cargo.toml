[package]
name = "stokesforge-script"
version = "0.0.0"
edition.workspace = true
description = "Fil de script Python : cycle de vie de l'interpréteur, interruption, et surface-témoin `pyst` exposée aux scripts. Tout derrière la feature `python`."

[lints]
workspace = true

[features]
default = []
# Tout ce qui touche à Python est derrière cette feature : sans elle, le crate
# compile vide, ne tire aucune dépendance PyO3, et la CI reste verte sur une
# machine sans interpréteur vendorisé.
python = [
    "dep:stokesforge-core",
    "dep:stokesforge-commands",
    "dep:stokesforge-plot",
    "dep:stokesforge-session",
    "dep:stokesforge-python",
    "dep:stokesforge-import",
    "dep:stokesforge-importer",
    "dep:pyo3",
    "dep:numpy",
    "dep:thiserror",
]

[dependencies]
stokesforge-core = { version = "0.0.0", path = "../stokesforge-core", optional = true }
stokesforge-commands = { version = "0.0.0", path = "../stokesforge-commands", optional = true }
stokesforge-plot = { version = "0.0.0", path = "../stokesforge-plot", optional = true }
stokesforge-session = { version = "0.0.0", path = "../stokesforge-session", optional = true }
stokesforge-python = { version = "0.0.0", path = "../stokesforge-python", optional = true, features = ["python"] }
stokesforge-import = { path = "../stokesforge-import", optional = true }
stokesforge-importer = { path = "../stokesforge-importer", optional = true }
# Versions EXACTEMENT celles de stokesforge-python : l'ABI numpy est liée à l'ABI
# CPython et rust-numpy à une version précise de PyO3 (cf. vendor/python/lock.env).
pyo3 = { version = "0.29.2", optional = true, default-features = false, features = ["macros"] }
numpy = { version = "0.29.0", optional = true }
thiserror = { version = "2.0", optional = true }

[dev-dependencies]
stokesforge-render-svg = { path = "../stokesforge-render-svg" }
stokesforge-render = { path = "../stokesforge-render" }
stokesforge-arch-guard = { path = "../stokesforge-arch-guard" }
toml = "0.8"
tempfile = "3"

[[bin]]
name = "stokesforge-selftest"
path = "src/bin/stokesforge-selftest.rs"
required-features = ["python"]

[[example]]
name = "matplotlib-spike"
path = "examples/matplotlib-spike.rs"
required-features = ["python"]
