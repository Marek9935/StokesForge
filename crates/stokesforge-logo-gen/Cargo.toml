[package]
name = "stokesforge-logo-gen"
version = "1.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Rasterises the application icon and the project-file icon (SVG) into the PNG and ICO sizes of a release (#388)."

[lints]
workspace = true

# No workspace dependency: the packaging scripts build and run it alone.
[dependencies]
# Pinned to the version `stokesforge-render-svg` already locks, so that no
# second `usvg` appears in `Cargo.lock`.
resvg = { version = "=0.45.1", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "ico"] }

[dev-dependencies]
tempfile = "3"
