[package]
name = "stokesforge-render-svg"
version = "1.0.0"
edition.workspace = true
license.workspace = true
description = "SVG export of a StokesForge graph: the plotters SVGBackend, whose estimate_text_size is overridden with the shared measurement."

[lints]
workspace = true

[dependencies]
stokesforge-core = { path = "../stokesforge-core" }
stokesforge-plot = { path = "../stokesforge-plot" }
# Provides text measurement (hence `epaint`) and the Plotters pipeline shared
# by both backends. `epaint` enters this crate through here, not directly:
# one single edge, hence one single possible version.
stokesforge-render = { path = "../stokesforge-render" }
plotters = { version = "0.3", default-features = false, features = [
    "all_series",
    "all_elements",
    "svg_backend",
] }
plotters-backend = "0.3"
thiserror = "2"
# SVG → PDF conversion (R6): comes from the Typst organization, hence from
# the family already adopted. No third backend: this crate re-parses the SVG
# it has just written (architecture-choisie.md §5).
svg2pdf = "0.13.0"
# PNG export: same pattern as PDF (conversion of the SVG already produced),
# through `resvg` — `png` module. Pinned exactly to the version `svg2pdf`
# already pulls in internally (see Cargo.lock) so that two `usvg` do not
# coexist in the dependency tree.
resvg = "=0.45.1"
# R8, export path (8.4): the `Font` type of `TypstExport` and the SVG
# fragment of a compiled page, inlined in the Plotters SVG. `stokesforge-render`
# provides the `World`, the compilation and the generic cache; this crate
# only adds what is specific to export. Firm dependency since issue #29 (no
# more `typst` feature). Version pinned exactly, as in `stokesforge-render`
# and `stokesforge-render-egui` (same reason).
typst = "=0.15.1"
typst-svg = "=0.15.1"

# #162: the outline of a glyph with no Unicode character (per-glyph fallback
# of `typst_text`). Same version as the one `typst` already pulls in.
ttf-parser = "0.25"

[dev-dependencies]
tempfile = "3"
toml = "0.8"
# Re-reads the produced PDF with a parser independent of ours — task 6.2:
# "the PDF opens". Without optional features (encryption, image, timestamp):
# it is only used to find the `MediaBox` of a page.
lopdf = { version = "0.45", default-features = false }
