[package]
name = "stokesforge-render-svg"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "Export SVG d'un graphe StokesForge : le SVGBackend de plotters, dont estimate_text_size est surchargé sur la mesure partagée du chantier."

[lints]
workspace = true

[dependencies]
stokesforge-core = { path = "../stokesforge-core" }
stokesforge-plot = { path = "../stokesforge-plot" }
# Apporte la mesure de texte (donc `epaint`) et le pipeline Plotters commun
# aux deux backends. C'est par ici, et non en direct, qu'`epaint` entre dans
# ce crate : une seule arête, donc une seule version possible.
stokesforge-render = { path = "../stokesforge-render" }
plotters = { version = "0.3", default-features = false, features = [
    "all_series",
    "all_elements",
    "svg_backend",
] }
plotters-backend = "0.3"
thiserror = "2"
# Conversion SVG → PDF (R6) : vient de l'organisation Typst, donc de la
# famille déjà adoptée. Pas de troisième backend : ce crate reparse le SVG
# qu'il vient d'écrire (architecture-choisie.md §5).
svg2pdf = "0.13.0"
# Export PNG : même patron que le PDF (conversion du SVG déjà produit), via
# `resvg` — module `png`. Épinglé exactement sur la version que `svg2pdf`
# tire déjà en interne (voir Cargo.lock) pour ne pas faire coexister deux
# `usvg` dans l'arbre de dépendances.
resvg = "=0.45.1"
# R8, chemin export (8.4) : le type `Font` de `TypstExport` et le fragment
# SVG d'une page compilée, inliné dans le SVG de Plotters. `stokesforge-render`
# apporte le `World`, la compilation et le cache générique ; ce crate
# n'ajoute que ce qui est propre à l'export. Dépendance ferme depuis l'issue
# #29 (plus de feature `typst`). Version épinglée exactement, comme dans
# `stokesforge-render` et `stokesforge-render-egui` (même raison).
typst = "=0.15.1"
typst-svg = "=0.15.1"

# #162 : le contour d'un glyphe sans caractère Unicode (repli par glyphe de
# `typst_text`). Même version que celle que `typst` tire déjà.
ttf-parser = "0.25"

[dev-dependencies]
tempfile = "3"
toml = "0.8"
# Relit le PDF produit avec un analyseur indépendant du nôtre — tâche 6.2 :
# « le PDF s'ouvre ». Sans fonctionnalités optionnelles (chiffrement, image,
# horodatage) : il ne sert qu'à retrouver le `MediaBox` d'une page.
lopdf = { version = "0.45", default-features = false }
