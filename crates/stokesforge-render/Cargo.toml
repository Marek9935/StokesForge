[package]
name = "stokesforge-render"
version = "1.0.0"
edition.workspace = true
license.workspace = true
description = "Foundation of the two rendering backends: the single source of text measurement (epaint) and the Plotters pipeline, neutral toward the backend."

[lints]
workspace = true

[dependencies]
stokesforge-core = { path = "../stokesforge-core" }
stokesforge-plot = { path = "../stokesforge-plot" }
# Plotters without its fonts (`architecture-choisie.md` §4.4): no font-kit, no
# image, no chrono, no ttf-parser, no system font scan. Removing them is only
# safe because BOTH backends override `estimate_text_size` with the
# measurement of this crate — it is the one point of the work package where a
# bug is silent.
plotters = { version = "0.3", default-features = false, features = [
    "all_series",
    "all_elements",
] }
plotters-backend = "0.3"
# `epaint` alone, not `egui`: this crate only needs text layout (`Fonts`,
# `FontDefinitions`, `TextOptions`), not a UI stack. This is what lets
# `stokesforge-render-svg` measure like the screen without pulling
# egui/eframe/winit into its tree.
epaint = { version = "0.36.2", default-features = false, features = [
    "default_fonts",
] }
# Resolving a system font by name (`fonts.rs`, font embedding of 2026-09-13):
# in substance the same mechanism that `stokesforge-render-svg::pdf` already
# uses on the export side (R6) so that text is not lost silently. Version
# aligned with the one `usvg` already locks in `Cargo.lock`, to avoid having
# a second one coexist.
fontdb = "0.23"
# R8 (Typst). Firm dependency since issue #29: the `typst` feature, outside
# `default` originally (`architecture-choisie.md` §7), was removed because
# all title and legend text goes through Typst (issue #28) — a build without
# it would draw a different figure. Versions pinned exactly (`=0.15.1`) as
# the rest of the repository does for its sensitive dependencies (cf.
# `svg2pdf`, `eframe`): the Typst API is not stable from one minor version to
# the next (checked while writing the `World`, R0).
typst = "=0.15.1"
# `PagedDocument` and the layout function come from this crate, not from
# `typst` (checked in the source, not assumed — R0 had already noted it).
# `typst` re-exports all of `typst-library` (`Library`, `World`, `FontBook`,
# `Font`, `Bytes`, `Datetime`…) and `typst-syntax` (`FileId`, `Source`,
# `VirtualPath`…) under `typst::` — no need for these crates directly.
typst-layout = "=0.15.1"

[dev-dependencies]
stokesforge-arch-guard = { path = "../stokesforge-arch-guard" }
toml = "0.8"
# Checks, in the tests of `fonts.rs`, that the embedded files really are
# fonts and that their family names match what the file declares — the same
# library `epaint` uses for layout (`architecture-choisie.md` §4.3), at the
# version it already locks.
skrifa = "0.44"
