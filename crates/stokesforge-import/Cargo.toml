[package]
name = "stokesforge-import"
version = "1.0.0"
edition.workspace = true
license.workspace = true
description = "Import of instrument data files (CSV/TXT) through reusable parsing recipes."

[lints]
workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
directories = "5"
thiserror = "2"

[dev-dependencies]
stokesforge-arch-guard = { path = "../stokesforge-arch-guard" }
tempfile = "3"
