[package]
name = "plotyx-app"
version = "0.0.0"
edition.workspace = true
description = "Coquille UI minimale (banc d'essai eframe) : fait tourner une fois la boucle modèle → commande → annulation → sauvegarde → rechargement."

[lints]
workspace = true

[features]
default = []
# Le pont Python (fil de script + interpréteur embarqué) est optionnel :
# sans cette feature, plotyx-app compile, teste et s'exécute exactement comme
# avant cette tâche, sans tirer PyO3 ni exiger d'interpréteur vendorisé. La
# console de script reste visible mais désactivée (cf. `state::AppState::
# script_available`).
python = ["dep:plotyx-script", "dep:plotyx-python"]

[dependencies]
plotyx-core = { path = "../plotyx-core" }
plotyx-commands = { path = "../plotyx-commands" }
plotyx-session = { path = "../plotyx-session" }
plotyx-persistence = { path = "../plotyx-persistence" }
plotyx-plot = { path = "../plotyx-plot" }
plotyx-render-egui = { path = "../plotyx-render-egui" }
# Chemins optionnels, activés uniquement par la feature `python` de CE crate :
# c'est elle qui active la feature `python` de chacun (dont dépend l'existence
# même de leurs types publics, cf. la doc de tête de leurs `lib.rs`).
plotyx-script = { path = "../plotyx-script", optional = true, features = ["python"] }
plotyx-python = { path = "../plotyx-python", optional = true, features = ["python"] }
eframe = "0.36.2"
egui_extras = "0.36.2"
# Disposition dockable (`docs/archive/rustrewrite/roadmap.md` §7 avait déjà
# tranché contre `iced`) : 0.21.1 est la version la plus récente au moment de
# cet ajout et compile contre `egui`/`eframe` 0.36.2, déjà fixés ailleurs dans
# le workspace pour le rendu (vérifié par une compilation d'essai avant
# d'ajouter la dépendance ici).
egui_dock = "0.21.1"
# Sélecteur de fichiers natif pour Save/Load (remplace le champ texte de
# saisie manuelle du chemin, cf. `docs/application.md` § « Limites assumées
# du banc »). `xdg-portal` (feature par défaut) est une dépendance runtime
# sous Wayland, pas une dépendance de lien : ce crate compile sans portail
# système présent.
rfd = "0.17.2"
anyhow = "1"
# Lecture du presse-papier système pour Ctrl+V dans la grille de worksheet :
# `egui::Context::copy_text` écrit dans le presse-papier système (Ctrl+C/X)
# mais n'offre aucune lecture symétrique — déjà présent en dépendance
# transitive d'`eframe`/`egui-winit` (voir `Cargo.lock`), fixé ici en
# dépendance directe pour pouvoir l'appeler depuis `plotyx-app`.
arboard = "3"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "plotyx-app"
path = "src/main.rs"
