[package]
name = "plotyx-render-egui"
version = "0.0.0"
edition.workspace = true
description = "Backend egui de plotters : collecte des egui::Shape dans un Vec, cache sur (revision, rect, pixels_per_point)."

[lints]
workspace = true

[features]
default = []
# R8 : le chemin écran (8.3) — `typst-render` en RGBA, texture, `Shape::Mesh`.
# `architecture-choisie.md` §7 : absente de `default`, condition du droit
# d'abandonner Typst sans rien démonter. `plotyx-render/typst` apporte le
# `World`, la compilation et le cache générique (8.1/8.2) ; ce crate n'ajoute
# que ce qui est propre à l'écran.
typst = ["dep:typst", "dep:typst-render", "plotyx-render/typst"]

[dependencies]
plotyx-core = { path = "../plotyx-core" }
plotyx-plot = { path = "../plotyx-plot" }
plotyx-session = { path = "../plotyx-session" }
plotyx-render = { path = "../plotyx-render" }
plotters = { version = "0.3", default-features = false, features = [
    "all_series",
    "all_elements",
] }
plotters-backend = "0.3"
# Alignée sur `plotyx-app`, qui est sur eframe 0.36.2 : `egui-plotter` a été
# écarté précisément parce qu'aucune de ses versions ne suit
# (`architecture-choisie.md` §4).
egui = "0.36.2"
# R8, feature `typst` : le type `Font`/`Bytes` de `TypstScreen` et le
# rendu RGBA d'une page compilée. Version épinglée exactement, comme dans
# `plotyx-render` — même raison (API non stabilisée entre versions
# mineures).
typst = { version = "=0.15.1", optional = true }
typst-render = { version = "=0.15.1", optional = true }

[dev-dependencies]
plotyx-commands = { path = "../plotyx-commands" }
# Le test d'accord (R4.5) vit ici et non dans `plotyx-render-svg` : en
# dépendance de développement, il ferait entrer egui dans l'arbre du crate
# d'export, ce que `cargo tree -p plotyx-render-svg` doit continuer à
# démentir.
plotyx-render-svg = { path = "../plotyx-render-svg" }
