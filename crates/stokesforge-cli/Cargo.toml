[package]
name = "stokesforge-cli"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "Binaire headless : importe des fichiers et exécute des scripts Python dans une session sans interface."

[lints]
workspace = true

[features]
default = []
python = ["dep:stokesforge-session", "dep:stokesforge-script", "dep:stokesforge-python"]

[dependencies]
stokesforge-session = { path = "../stokesforge-session", optional = true }
stokesforge-script = { path = "../stokesforge-script", optional = true, features = ["python"] }
stokesforge-python = { path = "../stokesforge-python", optional = true, features = ["python"] }
stokesforge-core = { path = "../stokesforge-core" }
stokesforge-commands = { path = "../stokesforge-commands" }
stokesforge-import = { path = "../stokesforge-import" }
stokesforge-importer = { path = "../stokesforge-importer" }
stokesforge-persistence = { path = "../stokesforge-persistence" }

[dev-dependencies]
tempfile = "3"
