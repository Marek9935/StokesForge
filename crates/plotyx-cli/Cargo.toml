[package]
name = "plotyx-cli"
version = "0.0.0"
edition.workspace = true
description = "Binaire headless : vérifie que le socle se lie, et importe des fichiers d'appareils dans un projet sans interface."

[lints]
workspace = true

[dependencies]
plotyx-core = { path = "../plotyx-core" }
plotyx-commands = { path = "../plotyx-commands" }
plotyx-import = { path = "../plotyx-import" }
plotyx-importer = { path = "../plotyx-importer" }
plotyx-persistence = { path = "../plotyx-persistence" }

[dev-dependencies]
tempfile = "3"
