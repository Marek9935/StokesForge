[package]
name = "plotyx-cli"
version = "0.0.0"
edition.workspace = true
description = "Binaire headless : importe des fichiers et exécute des scripts Python dans une session sans interface."

[lints]
workspace = true

[features]
default = []
python = ["dep:plotyx-session", "dep:plotyx-script", "dep:plotyx-python"]

[dependencies]
plotyx-session = { path = "../plotyx-session", optional = true }
plotyx-script = { path = "../plotyx-script", optional = true, features = ["python"] }
plotyx-python = { path = "../plotyx-python", optional = true, features = ["python"] }
plotyx-core = { path = "../plotyx-core" }
plotyx-commands = { path = "../plotyx-commands" }
plotyx-import = { path = "../plotyx-import" }
plotyx-importer = { path = "../plotyx-importer" }
plotyx-persistence = { path = "../plotyx-persistence" }

[dev-dependencies]
tempfile = "3"
