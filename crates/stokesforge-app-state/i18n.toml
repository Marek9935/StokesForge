# i18n-embed configuration for `stokesforge-app-state` (issue #41, #263).
# English is the source language: the `en` catalog is the reference, `fl!`
# checks its keys at compile time, and any key missing from another language
# falls back to English.
#
# The catalog lives here (`i18n/`) but also serves `stokesforge-app`, whose
# `tr!` calls expand inside this crate: `fl!` reads the `i18n.toml` of the
# CALLING crate and takes the domain from the package name. Both files
# therefore set the same domain, `stokesforge_app` (the `.ftl` file name,
# unchanged).
fallback_language = "en"

[fluent]
assets_dir = "i18n"
domain = "stokesforge_app"
