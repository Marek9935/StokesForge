# Configuration de i18n-embed pour `stokesforge-app-state` (issue #41, #263).
# L'anglais est la langue source : le catalogue `en` est la référence, `fl!` en
# vérifie les clés à la compilation, et toute clé absente d'une autre langue
# reprend l'anglais.
#
# Le catalogue vit ici (`i18n/`) mais sert aussi `stokesforge-app`, dont les
# `tr!` se déplient dans ce crate-là : `fl!` lit l'`i18n.toml` du crate APPELANT
# et tire le domaine du nom du paquet. Les deux fichiers fixent donc le même
# domaine, `stokesforge_app` (nom du fichier `.ftl`, inchangé).
fallback_language = "en"

[fluent]
assets_dir = "i18n"
domain = "stokesforge_app"
