[package]
name = "stokesforge-clipboard"
version = "1.0.1"
edition.workspace = true
license.workspace = true
description = "Offre d'un même contenu au presse-papiers système sous plusieurs types MIME (figure SVG, PNG, PDF)."

[lints]
workspace = true

[dependencies]
raw-window-handle = "0.6.2"
thiserror = "2"

# Linux et BSD : Wayland passe par le récepteur partagé de `vendor/smithay-clipboard`
# (le même worker que le texte d'egui-winit), X11 par un propriétaire de
# sélection écrit ici.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
smithay-clipboard = "0.7.3"
x11rb = "0.13.2"

[target.'cfg(windows)'.dependencies]
clipboard-win = "5.4.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSPasteboard"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSData", "NSString"] }

[dev-dependencies]
stokesforge-arch-guard = { path = "../stokesforge-arch-guard" }
