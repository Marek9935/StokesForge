[package]
name = "stokesforge-clipboard"
version = "1.0.0"
edition.workspace = true
license.workspace = true
description = "Offers the same content to the system clipboard under several MIME types (SVG, PNG, PDF figure)."

[lints]
workspace = true

[dependencies]
raw-window-handle = "0.6.2"
thiserror = "2"

# Linux and BSD: Wayland goes through the shared receiver of `vendor/smithay-clipboard`
# (the same worker as egui-winit's text), X11 through a selection
# owner written here.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
smithay-clipboard = "0.7.3"
x11rb = "0.13.2"

[target.'cfg(windows)'.dependencies]
clipboard-win = "5.4.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSPasteboard"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSData", "NSString"] }

[dev-dependencies]
stokesforge-arch-guard = { path = "../stokesforge-arch-guard" }
