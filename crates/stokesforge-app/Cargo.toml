[package]
name = "stokesforge-app"
version = "1.0.0"
edition.workspace = true
license.workspace = true
description = "Minimal UI shell (eframe test bench): runs the model → command → undo → save → reload loop once."

[lints]
workspace = true

[features]
default = []
# The Python bridge (script thread + embedded interpreter) is optional:
# without this feature, stokesforge-app compiles, tests and runs exactly as
# before this task, without pulling in PyO3 or requiring a vendored
# interpreter. The script console stays visible but disabled (see
# `state::AppState::script_available`, in stokesforge-app-state, whose
# `python` feature carries the script thread).
python = ["stokesforge-app-state/python", "dep:stokesforge-python"]

[dependencies]
stokesforge-app-state = { path = "../stokesforge-app-state" }
stokesforge-analysis = { path = "../stokesforge-analysis" }
stokesforge-core = { path = "../stokesforge-core" }
stokesforge-commands = { path = "../stokesforge-commands" }
stokesforge-import = { path = "../stokesforge-import" }
stokesforge-session = { path = "../stokesforge-session" }
stokesforge-plot = { path = "../stokesforge-plot" }
stokesforge-render = { path = "../stokesforge-render" }
stokesforge-render-egui = { path = "../stokesforge-render-egui" }
# Export of the graph as SVG, PDF or PNG (issue #34): the same pipeline as
# the screen, Typst text included. No command: the export does not touch the
# model.
stokesforge-render-svg = { path = "../stokesforge-render-svg" }
# Copy of the figure to an external application (issue #149): multi-format
# offer (SVG, PNG, PDF) to the system clipboard, which neither egui nor
# `arboard` can do.
stokesforge-clipboard = { path = "../stokesforge-clipboard" }
# Optional path, enabled only by the `python` feature of THIS crate: it is
# what enables the `python` feature of each (on which the very existence of
# their public types depends, see the top doc of their `lib.rs`); the script
# thread is pulled in by `stokesforge-app-state/python`.
stokesforge-python = { path = "../stokesforge-python", optional = true, features = ["python"] }
eframe = "0.36.2"
# Same version as eframe. The winit/smithay-clipboard patches share the
# Wayland receiver (#72); main.rs allows STOKESFORGE_X11=1 as a fallback.
winit = { version = "0.30", default-features = false, features = ["x11", "wayland"] }
# `svg`: loader of the embedded icons (`icons.rs`); resvg is already in the
# tree (stokesforge-render-svg), no new dependency.
egui_extras = { version = "0.36.2", features = ["svg"] }
# Reading the system clipboard for "Paste" taken from a context menu: egui
# only exposes writing (`Context::copy_text`), and Ctrl+V only works because
# `egui-winit` reads the clipboard itself before pushing the `Event::Paste`.
# `arboard` is precisely the library it uses internally — it was already in
# the dependency tree, citing it here adds nothing to compile. See
# `app::system_clipboard_text`.
arboard = "3.6.1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Multilingual interface (issue #41, work package #39): the catalog, the
# loader and `tr!` live in `stokesforge-app-state`; `tr!` expands here to
# `i18n_embed_fl::fl!`, which checks at compile time that a key and its
# arguments exist in the `en` catalog (read through `i18n.toml`, which points
# to the catalog of `stokesforge-app-state`). No crate below depends on these
# libraries (the allow lists of `no_ui_dependency` would refuse them).
i18n-embed-fl = "0.10.1"

[dev-dependencies]
# `test-support`: the `cfg(test)` isolations of the preferences path and of
# the starting language only hold for the tests of stokesforge-app-state; ours
# build an `AppState` (#250, #263). Never in a normal build.
stokesforge-app-state = { path = "../stokesforge-app-state", features = ["test-support"] }
tempfile = "3"
# The configuration folder that `tests/preferences_isolation.rs` redirects.
directories = "5"
# Prototype of the Preferences window (app/preferences_proto.rs): drives the UI
# through AccessKit and freezes captures. No production dependency.
egui_kittest = { version = "0.36.2", features = ["snapshot", "wgpu"] }
# Cropping and PNG encoding (best compression) of the manual screenshots
# (app/manual_screenshots.rs, #365). Already in the tree through egui_kittest.
image = { version = "0.25", default-features = false, features = ["png"] }
# Exercises the parser of the Wayland patch in the ordinary tests of the workspace.
url = "2"

[target.'cfg(target_os = "linux")'.dev-dependencies]
# Exercises the exact channel of the winit patch, without a Wayland connection.
calloop = "0.13"

[[bin]]
name = "stokesforge-app"
path = "src/main.rs"
