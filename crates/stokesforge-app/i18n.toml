# i18n-embed configuration for `stokesforge-app` (issue #41, #263).
# The catalog lives in `stokesforge-app-state` (which carries `tr!` and the
# loader); the application only needs it for the compile-time check of `fl!`
# (keys and arguments), which reads the `i18n.toml` of the calling crate. Same
# domain as that of `stokesforge-app-state/i18n.toml`.
fallback_language = "en"

[fluent]
assets_dir = "../stokesforge-app-state/i18n"
domain = "stokesforge_app"
