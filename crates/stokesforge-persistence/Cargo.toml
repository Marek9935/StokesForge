[package]
name = "stokesforge-persistence"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "save / load d'un Project complet — frontière figée, format provisoire (phase 3)."

[lints]
workspace = true

[dependencies]
stokesforge-analysis = { path = "../stokesforge-analysis" }
stokesforge-core = { path = "../stokesforge-core" }
stokesforge-import = { path = "../stokesforge-import" }
stokesforge-plot = { path = "../stokesforge-plot" }
rmp-serde = "1.3.1"
rmpv = { version = "1.3.1", features = ["with-serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
tempfile = "3.27.0"
thiserror = "2"

[dev-dependencies]
stokesforge-arch-guard = { path = "../stokesforge-arch-guard" }
toml = "0.8"
