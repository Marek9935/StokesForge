[package]
name = "stokesforge-persistence"
version = "1.0.0"
edition.workspace = true
license.workspace = true
description = "save / load of a complete Project — frozen boundary, format frozen since V1 (invariant 12)."

[lints]
workspace = true

[dependencies]
stokesforge-analysis = { path = "../stokesforge-analysis" }
stokesforge-core = { path = "../stokesforge-core" }
stokesforge-import = { path = "../stokesforge-import" }
stokesforge-plot = { path = "../stokesforge-plot" }
rmp-serde = "1.3.1"
rmpv = { version = "1.3.1", features = ["with-serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
tempfile = "3.27.0"
thiserror = "2"

[dev-dependencies]
stokesforge-arch-guard = { path = "../stokesforge-arch-guard" }
toml = "0.8"
