# Les fonctions transcendantes de `f64` délèguent à la libm de la plateforme
# (CRT MSVC sous Windows, glibc sous Linux) : elles diffèrent au dernier ulp,
# et un ajustement itératif converge ici et pas là (#332). On passe donc par
# le crate `libm` (Rust pur), qui donne les mêmes bits partout. `sqrt`, `abs`,
# `floor`, `min`, `max`, `powi`… sont exacts ou sans libm : ils restent permis.
disallowed-methods = [
    { path = "f64::exp", reason = "libm::exp : mêmes bits sous Windows et Linux (#332)" },
    { path = "f64::exp2", reason = "libm::exp2 : mêmes bits sous Windows et Linux (#332)" },
    { path = "f64::exp_m1", reason = "libm::expm1 : mêmes bits sous Windows et Linux (#332)" },
    { path = "f64::ln", reason = "libm::log : mêmes bits sous Windows et Linux (#332)" },
    { path = "f64::ln_1p", reason = "libm::log1p : mêmes bits sous Windows et Linux (#332)" },
    { path = "f64::log", reason = "libm::log : mêmes bits sous Windows et Linux (#332)" },
    { path = "f64::log10", reason = "libm::log10 : mêmes bits sous Windows et Linux (#332)" },
    { path = "f64::log2", reason = "libm::log2 : mêmes bits sous Windows et Linux (#332)" },
    { path = "f64::powf", reason = "libm::pow : mêmes bits sous Windows et Linux (#332)" },
    { path = "f64::sin", reason = "libm::sin : mêmes bits sous Windows et Linux (#332)" },
    { path = "f64::cos", reason = "libm::cos : mêmes bits sous Windows et Linux (#332)" },
    { path = "f64::tan", reason = "libm::tan : mêmes bits sous Windows et Linux (#332)" },
    { path = "f64::sin_cos", reason = "libm::sincos : mêmes bits sous Windows et Linux (#332)" },
    { path = "f64::asin", reason = "libm::asin : mêmes bits sous Windows et Linux (#332)" },
    { path = "f64::acos", reason = "libm::acos : mêmes bits sous Windows et Linux (#332)" },
    { path = "f64::atan", reason = "libm::atan : mêmes bits sous Windows et Linux (#332)" },
    { path = "f64::atan2", reason = "libm::atan2 : mêmes bits sous Windows et Linux (#332)" },
    { path = "f64::sinh", reason = "libm::sinh : mêmes bits sous Windows et Linux (#332)" },
    { path = "f64::cosh", reason = "libm::cosh : mêmes bits sous Windows et Linux (#332)" },
    { path = "f64::tanh", reason = "libm::tanh : mêmes bits sous Windows et Linux (#332)" },
    { path = "f64::asinh", reason = "libm::asinh : mêmes bits sous Windows et Linux (#332)" },
    { path = "f64::acosh", reason = "libm::acosh : mêmes bits sous Windows et Linux (#332)" },
    { path = "f64::atanh", reason = "libm::atanh : mêmes bits sous Windows et Linux (#332)" },
    { path = "f64::hypot", reason = "libm::hypot : mêmes bits sous Windows et Linux (#332)" },
    { path = "f64::cbrt", reason = "libm::cbrt : mêmes bits sous Windows et Linux (#332)" },
    { path = "f64::mul_add", reason = "libm::fma : mêmes bits sous Windows et Linux (#332)" },
]
