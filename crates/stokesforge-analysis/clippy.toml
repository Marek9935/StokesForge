# The transcendental functions of `f64` delegate to the platform libm
# (MSVC CRT on Windows, glibc on Linux): they differ in the last ulp, and an
# iterative fit converges here and not there (#332). So we go through the
# `libm` crate (pure Rust), which gives the same bits everywhere. `sqrt`,
# `abs`, `floor`, `min`, `max`, `powi`… are exact or do not use libm: they
# stay allowed.
disallowed-methods = [
    { path = "f64::exp", reason = "libm::exp: same bits on Windows and Linux (#332)" },
    { path = "f64::exp2", reason = "libm::exp2: same bits on Windows and Linux (#332)" },
    { path = "f64::exp_m1", reason = "libm::expm1: same bits on Windows and Linux (#332)" },
    { path = "f64::ln", reason = "libm::log: same bits on Windows and Linux (#332)" },
    { path = "f64::ln_1p", reason = "libm::log1p: same bits on Windows and Linux (#332)" },
    { path = "f64::log", reason = "libm::log: same bits on Windows and Linux (#332)" },
    { path = "f64::log10", reason = "libm::log10: same bits on Windows and Linux (#332)" },
    { path = "f64::log2", reason = "libm::log2: same bits on Windows and Linux (#332)" },
    { path = "f64::powf", reason = "libm::pow: same bits on Windows and Linux (#332)" },
    { path = "f64::sin", reason = "libm::sin: same bits on Windows and Linux (#332)" },
    { path = "f64::cos", reason = "libm::cos: same bits on Windows and Linux (#332)" },
    { path = "f64::tan", reason = "libm::tan: same bits on Windows and Linux (#332)" },
    { path = "f64::sin_cos", reason = "libm::sincos: same bits on Windows and Linux (#332)" },
    { path = "f64::asin", reason = "libm::asin: same bits on Windows and Linux (#332)" },
    { path = "f64::acos", reason = "libm::acos: same bits on Windows and Linux (#332)" },
    { path = "f64::atan", reason = "libm::atan: same bits on Windows and Linux (#332)" },
    { path = "f64::atan2", reason = "libm::atan2: same bits on Windows and Linux (#332)" },
    { path = "f64::sinh", reason = "libm::sinh: same bits on Windows and Linux (#332)" },
    { path = "f64::cosh", reason = "libm::cosh: same bits on Windows and Linux (#332)" },
    { path = "f64::tanh", reason = "libm::tanh: same bits on Windows and Linux (#332)" },
    { path = "f64::asinh", reason = "libm::asinh: same bits on Windows and Linux (#332)" },
    { path = "f64::acosh", reason = "libm::acosh: same bits on Windows and Linux (#332)" },
    { path = "f64::atanh", reason = "libm::atanh: same bits on Windows and Linux (#332)" },
    { path = "f64::hypot", reason = "libm::hypot: same bits on Windows and Linux (#332)" },
    { path = "f64::cbrt", reason = "libm::cbrt: same bits on Windows and Linux (#332)" },
    { path = "f64::mul_add", reason = "libm::fma: same bits on Windows and Linux (#332)" },
]
