[package]
name = "plotyx-script"
version = "0.0.0"
edition.workspace = true
description = "Fil de script Python : cycle de vie de l'interpréteur, interruption, et surface-témoin `pyx` exposée aux scripts. Tout derrière la feature `python`."

[lints]
workspace = true

[features]
default = []
# Tout ce qui touche à Python est derrière cette feature : sans elle, le crate
# compile vide, ne tire aucune dépendance PyO3, et la CI reste verte sur une
# machine sans interpréteur vendorisé.
python = [
    "dep:plotyx-core",
    "dep:plotyx-commands",
    "dep:plotyx-session",
    "dep:plotyx-python",
    "dep:plotyx-import",
    "dep:plotyx-importer",
    "dep:pyo3",
    "dep:numpy",
    "dep:thiserror",
]

[dependencies]
plotyx-core = { version = "0.0.0", path = "../plotyx-core", optional = true }
plotyx-commands = { version = "0.0.0", path = "../plotyx-commands", optional = true }
plotyx-session = { version = "0.0.0", path = "../plotyx-session", optional = true }
plotyx-python = { version = "0.0.0", path = "../plotyx-python", optional = true, features = ["python"] }
plotyx-import = { path = "../plotyx-import", optional = true }
plotyx-importer = { path = "../plotyx-importer", optional = true }
# Versions EXACTEMENT celles de plotyx-python : l'ABI numpy est liée à l'ABI
# CPython et rust-numpy à une version précise de PyO3 (cf. vendor/python/lock.env).
pyo3 = { version = "0.29.2", optional = true, default-features = false, features = ["macros"] }
numpy = { version = "0.29.0", optional = true }
thiserror = { version = "2.0", optional = true }

[dev-dependencies]
plotyx-arch-guard = { path = "../plotyx-arch-guard" }
toml = "0.8"
tempfile = "3"

[[bin]]
name = "plotyx-selftest"
path = "src/bin/plotyx-selftest.rs"
required-features = ["python"]
