[package]
name = "stokesforge-render-egui"
version = "1.0.0"
edition.workspace = true
license.workspace = true
description = "egui backend for plotters: collects egui::Shape values in a Vec, cache keyed on (revision, rect, pixels_per_point)."

[lints]
workspace = true

[dependencies]
stokesforge-core = { path = "../stokesforge-core" }
stokesforge-plot = { path = "../stokesforge-plot" }
stokesforge-session = { path = "../stokesforge-session" }
stokesforge-render = { path = "../stokesforge-render" }
plotters = { version = "0.3", default-features = false, features = [
    "all_series",
    "all_elements",
] }
plotters-backend = "0.3"
# Aligned with `stokesforge-app`, which is on eframe 0.36.2: `egui-plotter`
# was ruled out precisely because none of its versions follows
# (`architecture-choisie.md` §4).
egui = "0.36.2"
# R8, screen path (8.3): the `Font`/`Bytes` type of `TypstScreen` and the
# RGBA rendering of a compiled page (`typst-render` → texture → `Shape::Mesh`).
# `stokesforge-render` provides the `World`, the compilation and the generic
# cache; this crate only adds what is specific to the screen. Firm dependency
# since issue #29 (no more `typst` feature). Version pinned exactly, as in
# `stokesforge-render` — same reason (API not stable between minor versions).
typst = "=0.15.1"
typst-render = "=0.15.1"

[dev-dependencies]
stokesforge-import = { path = "../stokesforge-import" }
stokesforge-commands = { path = "../stokesforge-commands" }
# The agreement test (R4.5) lives here and not in `stokesforge-render-svg`: as
# a development dependency, it would bring egui into the tree of the export
# crate, which `cargo tree -p stokesforge-render-svg` must keep disproving.
stokesforge-render-svg = { path = "../stokesforge-render-svg" }
