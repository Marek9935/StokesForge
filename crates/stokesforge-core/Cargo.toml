[package]
name = "stokesforge-core"
version = "1.2.0"
edition.workspace = true
license.workspace = true
description = "StokesForge data model (project tree, columns) — zero UI dependency."

[lints]
workspace = true

[dependencies]
thiserror = "2"
# Lossless TOML editing for Script Settings (#548); already in the lockfile (typst, toml 0.8).
toml_edit = "0.22"
stokesforge-id = { path = "../stokesforge-id" }
stokesforge-analysis = { path = "../stokesforge-analysis" }
stokesforge-plot = { path = "../stokesforge-plot" }

[dev-dependencies]
stokesforge-arch-guard = { path = "../stokesforge-arch-guard" }
proptest = "1"
toml = "0.8"
