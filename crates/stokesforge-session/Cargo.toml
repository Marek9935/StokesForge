[package]
name = "stokesforge-session"
version = "1.0.0"
edition.workspace = true
license.workspace = true
description = "Actor that owns the StokesForge Project and serves it to its clients (UI, script) through a FIFO channel."

[lints]
workspace = true

[dependencies]
stokesforge-analysis = { path = "../stokesforge-analysis" }
stokesforge-core = { path = "../stokesforge-core" }
stokesforge-commands = { path = "../stokesforge-commands" }
thiserror = "2"
stokesforge-persistence = { version = "1.0.0", path = "../stokesforge-persistence" }

[dev-dependencies]
stokesforge-arch-guard = { path = "../stokesforge-arch-guard" }
stokesforge-plot = { path = "../stokesforge-plot" }
tempfile = "3"
toml = "0.8"
