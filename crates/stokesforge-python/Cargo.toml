[package]
name = "stokesforge-python"
version = "1.0.0"
edition.workspace = true
license.workspace = true
description = "Embedded CPython interpreter (PyO3), GIL, array conversion. Does not know the model. Everything behind the `python` feature."

[lints]
workspace = true

[features]
default = []
# Everything that touches PyO3 is behind this feature: without it, the crate
# compiles empty and CI stays green on a machine without Python.
python = ["dep:pyo3", "dep:numpy", "dep:thiserror"]

[dependencies]
# `auto-initialize` deliberately ABSENT: initialization is explicit and
# lazy (see src/interpreter.rs).
pyo3 = { version = "0.29.2", optional = true, default-features = false, features = ["macros"] }
numpy = { version = "0.29.0", optional = true }
thiserror = { version = "2.0", optional = true }

[[bin]]
name = "stokesforge-pyhello"
path = "src/bin/pyhello.rs"
required-features = ["python"]
