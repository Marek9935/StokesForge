[package]
name = "stokesforge-python"
version = "1.0.0"
edition.workspace = true
license.workspace = true
description = "Interpréteur CPython embarqué (PyO3), GIL, conversion de tableaux. Ne connaît pas le modèle. Tout derrière la feature `python`."

[lints]
workspace = true

[features]
default = []
# Tout ce qui touche à PyO3 est derrière cette feature : sans elle, le crate
# compile vide et la CI reste verte sur une machine sans Python.
python = ["dep:pyo3", "dep:numpy", "dep:thiserror"]

[dependencies]
# `auto-initialize` volontairement ABSENT : l'initialisation est explicite et
# paresseuse (cf. src/interpreter.rs).
pyo3 = { version = "0.29.2", optional = true, default-features = false, features = ["macros"] }
numpy = { version = "0.29.0", optional = true }
thiserror = { version = "2.0", optional = true }

[[bin]]
name = "stokesforge-pyhello"
path = "src/bin/pyhello.rs"
required-features = ["python"]
