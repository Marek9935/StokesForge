[package]
name = "plotyx-render-svg"
version = "0.0.0"
edition.workspace = true
description = "Export SVG d'un graphe PlotYx : le SVGBackend de plotters, dont estimate_text_size est surchargé sur la mesure partagée du chantier."

[lints]
workspace = true

[features]
default = []
# R8 : le chemin export (8.4) — fragments `typst-svg` inlinés dans le SVG de
# Plotters. `architecture-choisie.md` §7 : absente de `default`, condition
# du droit d'abandonner Typst sans rien démonter. `plotyx-render/typst`
# apporte le `World`, la compilation et le cache générique (8.1/8.2) ; ce
# crate n'ajoute que ce qui est propre à l'export.
typst = ["dep:typst", "dep:typst-svg", "plotyx-render/typst"]

[dependencies]
plotyx-core = { path = "../plotyx-core" }
plotyx-plot = { path = "../plotyx-plot" }
# Apporte la mesure de texte (donc `epaint`) et le pipeline Plotters commun
# aux deux backends. C'est par ici, et non en direct, qu'`epaint` entre dans
# ce crate : une seule arête, donc une seule version possible.
plotyx-render = { path = "../plotyx-render" }
plotters = { version = "0.3", default-features = false, features = [
    "all_series",
    "all_elements",
    "svg_backend",
] }
plotters-backend = "0.3"
thiserror = "2"
# Conversion SVG → PDF (R6) : vient de l'organisation Typst, donc de la
# famille déjà adoptée. Pas de troisième backend : ce crate reparse le SVG
# qu'il vient d'écrire (architecture-choisie.md §5).
svg2pdf = "0.13.0"
# R8, feature `typst` : le type `Font` de `TypstExport` et le fragment SVG
# d'une page compilée. Version épinglée exactement, comme dans
# `plotyx-render` et `plotyx-render-egui` (même raison).
typst = { version = "=0.15.1", optional = true }
typst-svg = { version = "=0.15.1", optional = true }

[dev-dependencies]
tempfile = "3"
toml = "0.8"
# Relit le PDF produit avec un analyseur indépendant du nôtre — tâche 6.2 :
# « le PDF s'ouvre ». Sans fonctionnalités optionnelles (chiffrement, image,
# horodatage) : il ne sert qu'à retrouver le `MediaBox` d'une page.
lopdf = { version = "0.45", default-features = false }
