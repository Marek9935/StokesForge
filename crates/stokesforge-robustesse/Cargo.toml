[package]
name = "stokesforge-robustesse"
version = "1.0.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Robustness bench: failure reproductions and non-regression guards for the model, persistence, history, the session actor and the Python bridge."

[lints]
workspace = true

[features]
default = []
# Same rule as `stokesforge-python` and `stokesforge-script`: everything that
# touches PyO3 is behind this feature, absent from `default`. Without it, the
# two boundary batteries (`b7`, `b9`) compile empty and the bench stays green
# on a machine without the vendored interpreter.
python = ["dep:stokesforge-script", "dep:stokesforge-python"]

[dependencies]
stokesforge-analysis = { path = "../stokesforge-analysis" }
stokesforge-core = { path = "../stokesforge-core" }
stokesforge-plot = { path = "../stokesforge-plot" }
stokesforge-commands = { path = "../stokesforge-commands" }
stokesforge-session = { path = "../stokesforge-session" }
stokesforge-persistence = { path = "../stokesforge-persistence" }
stokesforge-script = { path = "../stokesforge-script", optional = true, features = ["python"] }
stokesforge-python = { path = "../stokesforge-python", optional = true, features = ["python"] }

[dev-dependencies]
# The application state, for the batteries that test the cell <-> text
# translation (`stokesforge-app-state` does not depend on egui: #263).
stokesforge-app-state = { path = "../stokesforge-app-state" }
proptest = "1"
tempfile = "3"
rmp-serde = "1.3.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"

# Allocation probe: it triggers a deliberate `abort()` (reproduction B3) and
# so cannot live in a test: a Rust allocation failure is not a catchable
# panic, it would take down the whole test binary.
[[bin]]
name = "stokesforge-alloc-probe"
path = "src/bin/alloc_probe.rs"

# Stack probe: a stack overflow is not a panic either: the runtime writes
# `has overflowed its stack` and calls `abort()`. Same reason as above: it
# cannot live in a test binary.
[[bin]]
name = "stokesforge-stack-probe"
path = "src/bin/stack_probe.rs"
