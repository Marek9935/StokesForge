# User manual (#345, #362). Built by mdBook (version pinned in
# scripts/manual-tools.env) with scripts/manual-build.sh.
[book]
title = "StokesForge manual"
language = "en"
src = "src"

[build]
create-missing = false

[output.html]
additional-css = ["icons.css"]
git-repository-url = "https://gitlab.com/askrzypczak/stokesforge"
edit-url-template = "https://gitlab.com/askrzypczak/stokesforge/-/edit/main/manual/{path}"

[output.html.search]
enable = true
